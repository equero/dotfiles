# ~/.config/kitty/kitty.conf
# Kitty runs inside the 'dev' distrobox (exported to the app menu).

# --- Fuente ---
font_family      JetBrainsMono Nerd Font Mono
font_size        12.0
disable_ligatures never

# --- Ventana ---
window_padding_width   10
background_opacity     0.88
dynamic_background_opacity yes
hide_window_decorations no
confirm_os_window_close 1
remember_window_size  yes
initial_window_width  110c
initial_window_height 32c

# --- Cursor / scroll ---
cursor_shape          beam
cursor_blink_interval 0.5
scrollback_lines      10000
copy_on_select        clipboard
enable_audio_bell     no

# --- Pestañas ---
tab_bar_edge         top
tab_bar_style        powerline
tab_powerline_style  slanted
tab_title_template   "{index}: {title}"

# --- Paneles (splits) ---
enabled_layouts splits,stack,tall

# --- Atajos (kitty_mod = ctrl+shift) ---
map kitty_mod+t      new_tab_with_cwd
map kitty_mod+enter  launch --location=hsplit --cwd=current
map kitty_mod+\      launch --location=vsplit --cwd=current
map kitty_mod+left   neighboring_window left
map kitty_mod+right  neighboring_window right
map kitty_mod+up     neighboring_window up
map kitty_mod+down   neighboring_window down
map kitty_mod+z      toggle_layout stack
map kitty_mod+equal  change_font_size all +1.0
map kitty_mod+minus  change_font_size all -1.0
map kitty_mod+0      change_font_size all 0
map kitty_mod+a>m    set_background_opacity +0.05
map kitty_mod+a>l    set_background_opacity -0.05
# Pestaña con la shell de SteamOS (fuera del contenedor)
map kitty_mod+h      launch --type=tab --title=SteamOS distrobox-host-exec bash -l

# --- Tema: Catppuccin Mocha ---
